<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Team — Daily Tasks &amp; Bookings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FAF7F0;font-family:'Work Sans',sans-serif;color:#2b2b2b}
h1,h2,h3{font-family:'Oswald',sans-serif;letter-spacing:.01em}
h1,h2,h3,#dashboard h1,#dashboard h2,#dashboard h3,#dashboard summary{text-transform:uppercase}
.shell{min-height:100vh;max-width:1200px;margin:0 auto}
.main{padding:20px 22px;min-width:0;max-width:1200px;margin:0 auto;width:100%}
.topbar{display:flex;gap:12px;align-items:center}
.search{flex:1;background:#fff;border:1px solid #E5DDC8;border-radius:999px;padding:10px 16px;color:#888;min-width:0}
.refresh{background:#768E78;color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;font-family:'Work Sans',sans-serif;flex-shrink:0}
/* Styles for the content loaded from data/data.json (its own <style> is not carried over) */
.wrap{max-width:1200px;margin:0 auto;padding:20px}
.header{text-align:center;padding:28px 16px 12px}
.header h1{font-size:42px;margin:0}
.quote{font-style:italic;color:#768E78;font-size:17px;margin:12px 0 4px}
.datetime{color:#777;font-size:15px}
.overview{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}
.stat{flex:1 1 200px;border-radius:16px;padding:18px;background:#fff;border:1px solid #E5DDC8}
.stat .big{font-family:'Oswald',sans-serif;font-size:34px}
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%}
#status{color:#888;font-size:13px}
#dashboard img,#dashboard svg{max-width:100%;height:auto}
#dashboard>div{max-width:100%}
@media(max-width:900px){
  .main{padding:16px}
  #dashboard>div>div{flex-wrap:wrap}
}
@media(max-width:640px){
  .main{padding:12px}
  .topbar{flex-wrap:wrap}
  .search{flex-basis:100%}
  #dashboard{font-size:14px}
  .header h1{font-size:30px}
  .wrap{padding:12px}
  .cards>div{flex:0 1 100% !important}
}
/* --- v4 content styles (from the design preview) --- */
h1,h2,h3{font-family:'Oswald',sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
.header{text-align:center;padding:28px 16px 12px}
.header h1{font-size:42px;margin:0}
.quote{font-style:italic;color:#768E78;font-size:17px;margin:12px 0 4px}
.datetime{color:#777;font-size:15px}
.overview{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}
.stat{flex:1 1 200px;border-radius:16px;padding:18px;background:#fff;border:1px solid #E5DDC8}
.stat .big{font-family:'Oswald',sans-serif;font-size:34px}
.cards{display:flex;flex-wrap:wrap;gap:14px}
.tcard{flex:1 1 320px;max-width:calc((100% - 28px)/3);border:1px solid #E5DDC8;border-radius:16px;padding:16px;background:#fff}
.navbtn{width:34px;height:34px;border-radius:50%;border:1px solid #2b2b2b;background:#fff;font-size:18px;line-height:1;cursor:pointer;flex:none}
.navbtn:hover{background:#2b2b2b;color:#fff}
.navbtn:disabled{opacity:.3;cursor:default}
.navbtn:disabled:hover{background:#fff;color:#2b2b2b}
.calwrap{background:#fff;border:1px solid #E5DDC8;border-radius:16px;padding:18px;margin:16px 0}
.calmain{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}
.calside{background:#F6F1E7;border-radius:14px;padding:14px;position:sticky;top:14px}
.calside h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:#768E78}
.person{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
.person:hover,.person.active{background:#fff}
.person .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none;color:#2b2b2b}
.person b{font-size:14px;display:block}
.person span{font-size:12px;color:#666;display:block}
.person .meta{margin-left:auto;text-align:right;flex:none}
.person .meta .sm{font-size:15px}
.person .meta .ov{font-size:11px;color:#c0392b;font-weight:700}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.dow{font-size:11px;text-transform:uppercase;color:#888;text-align:center;padding:4px}
.day{min-height:110px;border:1px solid #eee;border-radius:12px;padding:6px;font-size:12px;background:#fffdf8}
.day.empty{background:#f5f5f5;border-color:#f0f0f0}
.day.today{border:2px solid #241f38}
.day b{font-size:13px}
.day .wknd{color:#999}
.task{background:#dccdf5;border-radius:7px;padding:3px 5px;margin:3px 0;line-height:1.3}
.task.done{background:#d6f0d6;opacity:.85}
.shoot{background:#ffe14d;border-radius:7px;padding:3px 5px;margin:3px 0;line-height:1.3;font-weight:600}
.booking{background:#ffb3b3;border-radius:7px;padding:3px 5px;margin:3px 0;line-height:1.3}
.leave{background:#ff8a8a;color:#fff;border-radius:7px;padding:3px 5px;margin:3px 0;line-height:1.3;font-weight:600}
.wfh{background:#e8e8e8;border-radius:7px;padding:3px 5px;margin:3px 0;line-height:1.3;color:#555}
.day.leaveDay{background:#fff0f0}
.ph{background:#d6e8ff;border-radius:7px;padding:3px 5px;margin:3px 0;line-height:1.3;font-weight:600}
.day.phDay{background:#f0f7ff}
.cleared{background:#c8e8d8;border-radius:7px;padding:3px 5px;margin:3px 0;line-height:1.3}
.noTask{color:#aaa;font-size:11px}
.ovtag{color:#c0392b;font-weight:700;font-size:11px}
.calbtn{border:1px solid #ccc;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;font-family:'Work Sans',sans-serif}
@media(max-width:900px){.calmain{grid-template-columns:1fr}.calgrid{grid-template-columns:repeat(2,1fr)}.tcard{max-width:100%}}
@media(max-width:640px){.header h1{font-size:30px}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="shell">
<main class="main">
<div class="topbar">
<div class="search">Search a person, client or task…</div>
<button class="refresh" onclick="location.reload()">↻ Refresh</button>
</div>
<div id="dashboard"><p id="status">Loading…</p></div>
</main>
</div>
<script src="./app.js"></script>
</body>
</html>
